server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: buildsight-backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/buildsight}
    username: ${SPRING_DATASOURCE_USERNAME:buildsight}
    password: ${SPRING_DATASOURCE_PASSWORD:buildsight_local_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: BuildSight
    description: Construction Project Intelligence Platform
    version: 0.1.0

buildsight:
  cors:
    allowed-origins: ${BUILDSIGHT_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  demo:
    seed-enabled: ${BUILDSIGHT_DEMO_SEED_ENABLED:true}

  storage:
    s3-endpoint: ${BUILDSIGHT_STORAGE_S3_ENDPOINT:http://localhost:8333}
    filer-base-url: ${BUILDSIGHT_STORAGE_FILER_BASE_URL:http://localhost:8888}

  ai:
    ollama-base-url: ${BUILDSIGHT_OLLAMA_BASE_URL:http://localhost:11434}

    chat-model: ${BUILDSIGHT_AI_CHAT_MODEL:qwen3:4b}
    embedding-model: ${BUILDSIGHT_AI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    embedding-dimensions: ${BUILDSIGHT_AI_EMBEDDING_DIMENSIONS:1024}
    retrieval-limit: ${BUILDSIGHT_AI_RETRIEVAL_LIMIT:8}
    embedding-batch-size: ${BUILDSIGHT_AI_EMBEDDING_BATCH_SIZE:16}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
